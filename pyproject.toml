[project]
name = "the-sunwai"
version = "0.1.0"
description = "The Sunwai - Case Management Hearings e-Portal"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.0,<6.0",
    "python-decouple>=3.8",
    "django-htmx>=1.17",
    "whitenoise>=6.6.0",
    "dj-database-url>=3.1.0",
    "channels>=4.0.0",
    "Pillow>=10.0.0",
]

[tool.vercel]
entrypoint = "config.wsgi:application"
